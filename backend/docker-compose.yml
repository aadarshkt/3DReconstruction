# ── Services ──────────────────────────────────────────────────────────────────
services:

  # PostgreSQL database
  db:
    image: postgres:16-alpine
    container_name: floorplan_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-floorplan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-floorplan_secret}
      POSTGRES_DB: ${POSTGRES_DB:-floorplan}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-floorplan}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Redis (Celery broker + result backend)
  redis:
    image: redis:7-alpine
    container_name: floorplan_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # FastAPI application
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: floorplan_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-floorplan}:${POSTGRES_PASSWORD:-floorplan_secret}@db:5432/${POSTGRES_DB:-floorplan}
      DATABASE_SYNC_URL: postgresql+psycopg2://${POSTGRES_USER:-floorplan}:${POSTGRES_PASSWORD:-floorplan_secret}@db:5432/${POSTGRES_DB:-floorplan}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      DATA_DIR: /app/data
      DASHBOARD_BASE_URL: ${DASHBOARD_BASE_URL:-http://localhost:8000}
    volumes:
      - ./app:/app/app
      - ../web_dashboard:/app/web_dashboard
      - ./data:/app/data
    ports:
      - "8000:8000"
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  # Celery worker (runs COLMAP / Open3D pipeline)
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: floorplan_worker
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-floorplan}:${POSTGRES_PASSWORD:-floorplan_secret}@db:5432/${POSTGRES_DB:-floorplan}
      DATABASE_SYNC_URL: postgresql+psycopg2://${POSTGRES_USER:-floorplan}:${POSTGRES_PASSWORD:-floorplan_secret}@db:5432/${POSTGRES_DB:-floorplan}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      DATA_DIR: /app/data
      DASHBOARD_BASE_URL: ${DASHBOARD_BASE_URL:-http://localhost:8000}
    volumes:
      - ./app:/app/app
      - ./data:/app/data
    command: celery -A app.tasks.celery_tasks worker --loglevel=info --concurrency=1

  # Authentication Microservice (Google OAuth 2.0, Sessions, RBAC)
  auth:
    build:
      context: ../auth_service
      dockerfile: Dockerfile
    container_name: floorplan_auth
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-floorplan}:${POSTGRES_PASSWORD:-floorplan_secret}@db:5432/${POSTGRES_DB:-floorplan}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-super_secret_jwt_key_claimspace_change_in_production_2026}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-admin@claimspace.com}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      ALLOW_DEV_LOGIN: ${ALLOW_DEV_LOGIN:-true}
    volumes:
      - ../auth_service:/app
    ports:
      - "8002:8002"
    command: uvicorn main:app --host 0.0.0.0 --port 8002 --reload

  # Guided Tour Microservice (Deterministic Demo Assets & Walkthrough)
  tour:
    build:
      context: ../tour_service
      dockerfile: Dockerfile
    container_name: floorplan_tour
    restart: unless-stopped
    volumes:
      - ../tour_service:/app
    ports:
      - "8001:8001"
    command: uvicorn main:app --host 0.0.0.0 --port 8001 --reload

# ── Volumes ───────────────────────────────────────────────────────────────────
volumes:
  postgres_data:
