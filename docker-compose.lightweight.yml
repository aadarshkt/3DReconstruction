services:
  auth_service:
    build:
      context: ./auth_service
      dockerfile: Dockerfile
    container_name: claimspace-auth-service
    ports:
      - "8002:8002"
    env_file:
      - .env.local
    environment:
      - SERVICE_PORT=8002
      - DATABASE_URL=sqlite+aiosqlite:////app/data/auth.db
      - ALLOW_DEV_LOGIN=true
      - FRONTEND_URL=http://localhost:3000
    volumes:
      - auth_data:/app/data

  tour_service:
    build:
      context: ./tour_service
      dockerfile: Dockerfile
    container_name: claimspace-tour-service
    ports:
      - "8001:8001"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: claimspace-frontend
    ports:
      - "3000:3000"
    environment:
      - AUTH_SERVICE_URL=http://auth_service:8002
      - TOUR_SERVICE_URL=http://tour_service:8001
      - NODE_ENV=production
    depends_on:
      - auth_service
      - tour_service

volumes:
  auth_data:
